name: Generate IIIF presentation manifests

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

env:
  OUTPUT_DIR: _generated/presentation
  REPORT_FILE: _generated/manifest-generation-report.md
  INPUT_FILE: input/all-manifests.txt

jobs:
  run:
    runs-on: ubuntu-latest
    # Only run if manually triggered OR if issue has the iiif-generation label
    if: |
      github.event_name == 'workflow_dispatch' || 
      contains(github.event.issue.labels.*.name, 'iiif-generation')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/giacomomarchioro/pyIIIFpres requests

      # -------------------------
      # Parse issue and extract manifest content
      # -------------------------
      - name: Parse issue
        if: github.event_name == 'issues'
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/provide-bagit-manifests.yml

      - name: Debug - show parsed issue
        if: github.event_name == 'issues'
        run: cat ${HOME}/issue-parser-result.json

      - name: Extract manifest content from issue
        if: github.event_name == 'issues'
        run: |
          mkdir -p input
          
          python3 << 'PYTHON_SCRIPT'
          import json
          import re
          import urllib.request
          
          # Read parsed issue
          with open('/home/runner/issue-parser-result.json') as f:
              data = json.load(f)
          
          content = data.get('manifest-content', data.get('manifest_file_content', ''))
          
          print("=== Extracted content ===")
          print(content[:500])
          print("=========================")
          
          # Check if it's a markdown link with GitHub attachment
          markdown_link = re.search(r'\[([^\]]+)\]\((https://github\.com[^\)]*user-attachments[^\)]+)\)', content)
          
          if markdown_link:
              url = markdown_link.group(2)
              print(f"Detected markdown link, downloading from: {url}")
              urllib.request.urlretrieve(url, 'input/all-manifests.txt')
              print("Download complete")
          elif 'user-attachments' in content and content.startswith('http'):
              # Bare URL
              url = content.strip()
              print(f"Detected bare URL, downloading from: {url}")
              urllib.request.urlretrieve(url, 'input/all-manifests.txt')
          else:
              # Direct content
              print("Using pasted content directly")
              with open('input/all-manifests.txt', 'w') as f:
                  f.write(content)
          
          # Preview
          print("\n=== File preview ===")
          with open('input/all-manifests.txt') as f:
              lines = f.readlines()
              print(f"Total lines: {len(lines)}")
              for line in lines[:20]:
                  print(line.rstrip())
          PYTHON_SCRIPT

      # -------------------------
      # For workflow_dispatch, use hardcoded input for testing
      # -------------------------
      - name: Create hardcoded input for manual testing
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p input
          cat > "${INPUT_FILE}" << 'EOF'
          a978925b50f1d08c9c59449b1525b574  data/A-5/A-5-a_13/A-5-a_13_001.tif
          9a0b5aa249422bf3484fbdbebf4b6266  data/A-2/A-2-a/A-2-a_1/A-2-a_1-1-a_001.tif
          a0a711360efb11b3765ee2766919d90e  data/A-2/A-2-a/A-2-a_1/A-2-a_1-1-b_001-1.tif
          dede82a323ee71a20bf84ec3f70e6437  data/A-2/A-2-a/A-2-a_1/A-2-a_1-1-b_001-2.tif
          a3fc7ea62ba41efc9baf94a1f5b89624  data/A-2/A-2-a/A-2-a_1/A-2-a_1-1-c_001.tif
          EOF

      # -------------------------
      # 🚨 Validate uniqueness early
      # -------------------------
      - name: Validate unique filenames
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import sys

          input_path = "input/all-manifests.txt"

          seen = {}
          duplicates = []

          with open(input_path) as f:
              for i, line in enumerate(f, 1):
                  line = line.strip()
                  if not line:
                      continue

                  parts = line.split(maxsplit=1)
                  if len(parts) != 2:
                      continue

                  _, path = parts
                  filename = os.path.basename(path)

                  if filename in seen and seen[filename] != path:
                      duplicates.append((filename, seen[filename], path, i))
                  else:
                      seen[filename] = path

          if duplicates:
              print("❌ Duplicate filenames detected:\n")
              for f, old, new, line_no in duplicates[:20]:
                  print(f"{f}")
                  print(f"  first: {old}")
                  print(f"  again: {new} (line {line_no})\n")

              if len(duplicates) > 20:
                  print(f"...and {len(duplicates)-20} more")

              sys.exit(1)

          print(f"✅ All filenames unique ({len(seen)} entries)")
          PYTHON_SCRIPT

      # -------------------------
      # Path mapping UPSERT
      # -------------------------
      - name: Update path mapping index
        run: |
          mkdir -p meta
          mkdir -p "$(dirname "${REPORT_FILE}")"

          python3 << 'PYTHON_SCRIPT'
          import json
          import os

          index_path = "meta/path-mapping.json"
          input_path = "input/all-manifests.txt"
          report_path = os.environ.get("REPORT_FILE", "_generated/manifest-generation-report.md")

          if os.path.exists(index_path):
              with open(index_path) as f:
                  index = json.load(f)
          else:
              index = {}

          updates = {}
          replacements = []

          with open(input_path) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue

                  parts = line.split(maxsplit=1)
                  if len(parts) != 2:
                      continue

                  hash_val, path = parts
                  filename = os.path.basename(path)

                  if filename in index and index[filename] != path:
                      replacements.append({
                          "file": filename,
                          "old": index[filename],
                          "new": path
                      })

                  updates[filename] = path

          index.update(updates)

          with open(index_path, "w") as f:
              json.dump(index, f, indent=2, sort_keys=True)

          lines = []
          lines.append("\n## 📁 Path Mapping Updates\n")
          lines.append(f"- Added/updated entries: **{len(updates)}**")

          if replacements:
              lines.append(f"- Replacements: **{len(replacements)}**\n")
              lines.append("### 🔁 Overwritten mappings\n")

              for r in replacements[:50]:
                  lines.append(f"- `{r['file']}`")
                  lines.append(f"  - old: `{r['old']}`")
                  lines.append(f"  - new: `{r['new']}`")

              if len(replacements) > 50:
                  lines.append(f"\n_...and {len(replacements)-50} more_")
          else:
              lines.append("- Replacements: **0**")

          with open(report_path, "a") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Updated {len(updates)} entries, {len(replacements)} replacements")
          PYTHON_SCRIPT

      # -------------------------
      # Run manifest generator
      # -------------------------
      - name: Run manifest generator
        env:
          IIIF_IMAGE_BASE: "https://iiif.ub.unibe.ch/image/v3/"
          PROJECT_SEGMENT: "ceresa"
          IIIF_PRESENTATION_BASE: "https://iiif.arcipelago-ceresa.digitaleditions.ch/presentation"
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          REPORT_FILE: ${{ env.REPORT_FILE }}
          INPUT_FILE: ${{ env.INPUT_FILE }}
        run: |
          mkdir -p "$(dirname "${REPORT_FILE}")"
          mkdir -p "${OUTPUT_DIR}"
          python .github/scripts/generate_manifests.py \
            --input-file "${INPUT_FILE}" \
            --output-dir "${OUTPUT_DIR}" \
            --report-file "${REPORT_FILE}" \
            --iiif-image-base "${IIIF_IMAGE_BASE}" \
            --project-segment "${PROJECT_SEGMENT}" \
            --iiif-presentation-base "${IIIF_PRESENTATION_BASE}"

      # -------------------------
      # Create index page
      # -------------------------
      - name: Create index page
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Arcipelago Ceresa: IIIF Services</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      line-height: 1.6;
                      color: #333;
                      max-width: 800px;
                      margin: 0 auto;
                      padding: 2rem 1rem;
                  }
                  h1 { font-size: 2rem; margin-bottom: 2rem; }
                  section { margin-bottom: 2rem; }
                  h2 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #2c5282; }
                  a { color: #2b6cb0; text-decoration: none; }
                  a:hover { text-decoration: underline; }
                  code { background: #f7fafc; padding: 0.2rem 0.4rem; border-radius: 3px; }
                  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
              </style>
          </head>
          <body>
              <h1>Arcipelago Ceresa: IIIF Services</h1>
              <section>
                  <h2>IIIF Image API</h2>
                  <p>
                      Digitised images are hosted by the University Library of the University of Bern and exposed via their IIIF Image API.
                  </p>
                  <p>
                      Base URL: <code><a href="https://iiif.ub.unibe.ch/image/v3/ceresa/" target="_blank" rel="noopener">https://iiif.ub.unibe.ch/image/v3/ceresa/</a></code><br/>
                      <i>(not directly accessible; add file identifier + <code>.tif/info.json</code> to get functional links)</i>
                  </p>
                  <p>
                      For convenience, requests to <code>https://iiif.arcipelago-ceresa.digitaleditions.ch/image/v3/ceresa/*</code> 
                      are redirected to <code>https://iiif.ub.unibe.ch/image/v3/ceresa/*</code>.<br/>
                      In the given hosting environment (GitHub Pages), this redirect requires JavaScript. For programmatic access or tools 
                      without JS support, use the UB server directly: <code>https://iiif.ub.unibe.ch/image/v3/ceresa/{image-id}/info.json</code>.
                  </p>
              </section>
              <section>
                  <h2>IIIF Presentation API</h2>
                  <p>
                      Project-specific IIIF Presentation manifests are available for viewing digitised documents.
                  </p>
                  <p>
                      Browse manifests: <a href="/presentation/">presentation/</a>
                  </p>
              </section>
              <section>
                <h2>Meta Information</h2>
                <p>
                  In addition to IIIF services, auxiliary data is available for internal and integration purposes.
                </p>
                <p>
                  The <code>/meta/</code> path provides supporting resources and does not expose IIIF endpoints.
                </p>
                <p>
                  Available resource:
                </p>
                <ul>
                  <li>
                    <a href="/meta/path-mapping.json">Path Mapping (JSON)</a><br/>
                    <i>Maps image filenames to their original storage paths.</i>
                    <p>The mapping can be used to resolve filenames referenced in IIIF manifests back to their source paths in the original BagIt structure.</p>
                    <p><strong>Note:</strong> This dataset is consumed by downstream workflows for filename resolution.</p>
                  </li>
                </ul>
              </section>
            
              <footer>
                <p>
                  Workflow and source code: see <a href="https://github.com/DHBern/ceresa-manifest-mill" target="_blank" rel="noopener">Ceresa Manifest Mill</a>.
                </p>
              </footer>
          </body>
          </html>
          EOF

      # -------------------------
      # Create meta index
      # -------------------------
      - name: Create meta index
        run: |
          mkdir -p meta
          cat > meta/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Meta Information</title>
          </head>
          <body>
            <h1>Meta Information</h1>
            <p>This endpoint provides auxiliary data related to IIIF manifests.</p>
            <ul>
              <li><a href="path-mapping.json">Path Mapping (JSON)</a></li>
            </ul>
          </body>
          </html>
          EOF
      
      # -------------------------
      # Commit generated content + mapping
      # -------------------------
      - name: Commit generated manifests + mapping
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate IIIF manifests + update path mapping"
          file_pattern: '_generated/** meta/path-mapping.json meta/index.html'
          skip_fetch: true
          
      # -------------------------
      # Create 404 redirect for Image API passthrough
      # -------------------------
      - name: Create redirect script
        run: |
          mkdir -p assets
          cat > assets/redirect.js << 'EOF'
          (function() {
          const path = window.location.pathname;
        
          const imageApiMatch = path.match(/^(\/[^\/]+)?\/image\/v3\/ceresa\/(.+)$/);
        
          if (imageApiMatch) {
          const imagePath = imageApiMatch[2];
          window.location.replace('https://iiif.ub.unibe.ch/image/v3/ceresa/' + imagePath);
          return;
          }
        
          const base = path.match(/^\/[^\/]+\//)?.[0] || '/';
          window.location.replace(base);
          })();
          EOF
        
      - name: Create 404 redirect page
        run: |
          cat > 404.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
                <title>Redirecting...</title>
                <script src="/assets/redirect.js"></script>
            </head>
            <body>
              <p>Redirecting...</p>
              <noscript>
                <p>JavaScript is required. Please visit the <a href="/">homepage</a> or 
                  <a href="https://iiif.ub.unibe.ch/image/v3/ceresa/">access the Image API directly</a>.</p>
              </noscript>
            </body>
          </html>
          EOF

      # -------------------------
      # Prepare for GitHub Pages deployment
      # -------------------------
      - name: Copy presentation folder for Pages
        run: |
          cp -r _generated/presentation .

      - name: Generate Directory Listings
        uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: presentation

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # -------------------------
      # Comment report to issue
      # -------------------------
      - name: Comment report to issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ env.REPORT_FILE }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const reportPath = process.env.REPORT_FILE;
            const pagesUrl = process.env.PAGES_URL;

            let report;
            try {
            	report = fs.readFileSync(reportPath, 'utf8');
            } catch (e) {
            	report = `⚠️ Could not read report file:\n\n${e}`;
            }

            const pagesLine = pagesUrl
            	? `🌐 **Manifests published at:** ${pagesUrl}presentation/`
            	: `⚠️ Pages deployment not available`;

            const body = [
            	"## ✅ IIIF Manifest Generation Complete",
            	"",
            	report,
            	"",
            	"---",
            	"",
            	"## 🗺️ Meta / Path Mapping",
            	"- `/meta/path-mapping.json` updated (used for downstream workflows)",
            	"- `/meta/` available as auxiliary dataset (not IIIF endpoints)",
            	"",
            	pagesLine,
            	"",
            	`*Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}*`
            ].join("\n");

              await github.rest.issues.createComment({
            	owner: context.repo.owner,
            	repo: context.repo.repo,
            	issue_number: context.issue.number,
            	body
            });



      - name: Comment failure to issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              "## ❌ IIIF Manifest Generation Failed",
              "",
              "Duplicate filenames detected or another error occurred.",
              "",
              `Check the workflow run for details:`,
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("\n");
      
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
